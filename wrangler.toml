name = "bpc"
main = "src/index.js"
compatibility_date = "2026-10-01"

# DI-02: one domain for every organisation, web app and API. The workers.dev
# and preview URLs are switched off so this is the only public address.
routes = [{ pattern = "bpc.hsynrsd.dev", custom_domain = true }]
workers_dev = false
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
# /app/* runs the Worker first too, so only signed-in users get those pages (SCRUM-14, SCRUM-104).
run_worker_first = ["/api/*", "/app", "/app/*"]

# SCRUM-104: Clerk (sign-in). The publishable key is public; the secret key is
# set with `npx wrangler secret put CLERK_SECRET_KEY` and never committed.
[vars]
CLERK_PUBLISHABLE_KEY = "pk_test_bW9yYWwtZmlzaC03ODYzLmNsZXJrLmFjY291bnRzLmRldiQ"

# Local `npm run dev`: keep request URLs on localhost. Without this, wrangler
# rewrites them to the custom domain above, so Clerk rejects the localhost
# session and redirects point to the live site.
[dev]
port = 8787
host = "localhost:8787"

[observability]
enabled = true

# SCRUM-18 / FR-DOC-06: fetch the BMF fake company feed once a day.
# Cron times are UTC: 04:17 UTC is 05:17 in Vienna in winter, 06:17 in summer.
[triggers]
crons = ["17 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bpc"
# Created with `npx wrangler d1 create bpc --location weur` (DI-02).
database_id = "495b6010-eb07-46ae-b933-c1eca46818fd"
migrations_dir = "migrations"
